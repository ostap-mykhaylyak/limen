name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go fix has nothing to say
        run: |
          changes=$(go fix -diff ./...)
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race -count=1

      # Known vulnerabilities in the code limen calls, in the standard
      # library of this toolchain or in a dependency.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o bin/limen-${{ matrix.goarch }} ./cmd/limen

  # The renderer is only as good as what a real nginx accepts: the
  # integration tests drive one, on both lines limen targets — the
  # official image (recent, stream built in) and Debian's package
  # (older, stream loaded as a dynamic module).
  integration:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        image: ["nginx:stable", "debian:bookworm-slim"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: build the test binary
        run: CGO_ENABLED=0 go test -c -o nginx.test ./internal/nginx/
      - name: run it against ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/t" -e LIMEN_TEST_NGINX=/usr/sbin/nginx ${{ matrix.image }} sh -c '
            command -v nginx >/dev/null || { apt-get update -qq && apt-get install -y -qq nginx libnginx-mod-stream >/dev/null; }
            /t/nginx.test -test.run RealNginx -test.v -test.count=1'
