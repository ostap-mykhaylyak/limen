name: release

on:
  push:
    tags: ["v*"]
  # A change to the release itself is rehearsed on its pull request:
  # everything is built, nothing is published.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-rehearsal' }}

jobs:
  # A tag is released only if the tree it names passes the tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - run: go vet ./...
      - run: go test ./... -race -count=1

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o limen ./cmd/limen

      - name: tarball
        run: |
          name="limen-${VERSION}-linux-${{ matrix.goarch }}"
          mkdir -p "$name" dist
          # The binary provisions itself (limen --init), so the bundle
          # only carries the unit and the paperwork.
          cp limen internal/bootstrap/limen.service README.md CHANGELOG.md LICENSE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"

      - name: Debian package
        run: sh packaging/deb/build.sh "${VERSION}" ${{ matrix.goarch }} limen dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goarch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # Signed provenance: `gh attestation verify FILE --repo
      # ostap-mykhaylyak/limen` proves a file was built here, by this
      # workflow, from this tag.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      - name: release notes
        run: |
          # The CHANGELOG section of this version, heading excluded.
          awk -v v="## ${VERSION}" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
